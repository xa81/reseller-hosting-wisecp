name: Attach release packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build packages
        id: build
        run: |
          echo "v5=$(tools/build-release-zip.sh v5 HEAD)" >> "$GITHUB_OUTPUT"
          echo "v3=$(tools/build-release-zip.sh v3 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.v5 }}" "${{ steps.build.outputs.v3 }}" --clobber --repo "${{ github.repository }}"
